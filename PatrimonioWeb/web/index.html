<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5E5CE6">
  <title>Patrimônio</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- @@STYLES -->
  <link rel="stylesheet" href="styles.css">
  <!-- @@END_STYLES -->
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M8 23v-5M13 23v-8M18 23v-11M23 23v-14" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-name">Patrimônio</span>
      </div>
      <nav class="nav" aria-label="Seções">
        <button data-view="dashboard" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/></svg><span>Início</span>
        </button>
        <button data-view="portfolio" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M10 4h4a2 2 0 0 1 2 2v1h4a1 1 0 0 1 1 1v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a1 1 0 0 1 1-1h4V6a2 2 0 0 1 2-2zm0 3h4V6h-4z"/></svg><span>Carteira</span>
        </button>
        <button data-view="update" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 0 1 7.4 5H17v2h6V5h-2v2.3A10 10 0 0 0 2 12h2a8 8 0 0 1 8-8zm8 8a8 8 0 0 1-15.4 3H7v-2H1v6h2v-2.3A10 10 0 0 0 22 12z"/></svg><span>Atualizar</span>
        </button>
        <button data-view="cashflow" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zm2 2v2h14V8zm0 5v5h14v-5zm2 2h5v2H7z"/></svg><span>Orçamento</span>
        </button>
        <button data-view="settings" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.3 7.3 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.3 7.3 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.3 7.3 0 0 0 1.7 1L11 21h4l.3-2.9a7.3 7.3 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg><span>Ajustes</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <div id="save-status" class="save-status" aria-live="polite"></div>
        <div id="storage-label" class="storage-label"></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="page-title">Patrimônio</h1>
        <div class="topbar-actions">
          <button id="toggle-hide" class="icon-btn" title="Ocultar valores" aria-label="Ocultar valores">
            <svg viewBox="0 0 24 24"><path d="M12 5c5 0 9 4.5 10 7-1 2.5-5 7-10 7S3 14.5 2 12c1-2.5 5-7 10-7zm0 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg>
          </button>
        </div>
      </header>
      <div id="view" class="view">
        <div class="loading">Carregando seus dados…</div>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- @@SCRIPTS -->
  <script src="vendor/chart.umd.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/model.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/statement.js"></script>
  <script src="js/invoice.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/backends.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <!-- @@END_SCRIPTS -->
</body>
</html>

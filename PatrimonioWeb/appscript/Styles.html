<style>
:root {
  --bg: #f2f2f7;
  --surface: #ffffff;
  --surface-2: #f7f7fa;
  --fill: rgba(120, 120, 128, 0.12);
  --border: rgba(60, 60, 67, 0.12);
  --text: #1c1c1e;
  --text-2: #6c6c70;
  --text-3: #a1a1a6;
  --accent: #5e5ce6;
  --accent-soft: rgba(94, 92, 230, 0.12);
  --green: #1f9d45;
  --red: #e5383b;
  --orange: #e8890c;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.04);
  --radius: 16px;
  --sidebar: 232px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --surface: #1c1c1e;
    --surface-2: #2c2c2e;
    --fill: rgba(120, 120, 128, 0.24);
    --border: rgba(84, 84, 88, 0.5);
    --text: #f2f2f7;
    --text-2: #aeaeb2;
    --text-3: #6c6c70;
    --accent: #7d7aff;
    --accent-soft: rgba(125, 122, 255, 0.18);
    --green: #32d74b;
    --red: #ff5a5f;
    --orange: #ffa02e;
    --shadow: none;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
svg { fill: currentColor; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Estrutura ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar);
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 12px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 22px; }
.brand-logo { color: var(--accent); width: 32px; height: 32px; display: inline-flex; }
.brand-logo svg { width: 32px; height: 32px; }
.brand-name { font-weight: 700; font-size: 18px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  border: 0; background: none; cursor: pointer;
  padding: 10px 12px; border-radius: 10px;
  color: var(--text-2); font-weight: 500; text-align: left;
}
.nav-item svg { width: 20px; height: 20px; }
.nav-item:hover { background: var(--fill); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); }
.sidebar-foot { margin-top: auto; padding: 10px; font-size: 12px; color: var(--text-3); }
.save-status { min-height: 18px; }
.save-status.error { color: var(--red); }

.main { flex: 1; min-width: 0; }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px 32px 6px; gap: 12px;
}
.topbar h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.view { padding: 12px 32px 48px; max-width: 1280px; }
.loading { padding: 80px 0; text-align: center; color: var(--text-2); }

/* ---------- Componentes ---------- */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); }
.span-12 { grid-column: span 12; }
.span-8 { grid-column: span 8; }
.span-7 { grid-column: span 7; }
.span-6 { grid-column: span 6; }
.span-5 { grid-column: span 5; }
.span-4 { grid-column: span 4; }

.card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  padding: 18px 20px;
  min-width: 0;
}
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.card-title { font-size: 16px; font-weight: 650; margin: 0; }
.card-sub { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); font-size: 12px; }
.pos { color: var(--green); }
.neg { color: var(--red); }

.kpi-label { font-size: 13px; color: var(--text-2); }
.kpi-value { font-size: 34px; font-weight: 750; letter-spacing: -0.02em; margin: 2px 0 4px; }
.kpi-row { display: flex; flex-wrap: wrap; gap: 12px 28px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
.kpi-row .item .v { font-weight: 650; font-size: 16px; }
.kpi-row .item .l { font-size: 12px; color: var(--text-2); }

.seg { display: inline-flex; background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button {
  border: 0; background: none; padding: 5px 11px; border-radius: 7px; cursor: pointer;
  font-size: 13px; font-weight: 550; color: var(--text-2);
}
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid transparent; border-radius: 10px; padding: 8px 14px;
  font-weight: 600; cursor: pointer; background: var(--fill); color: var(--text);
  white-space: nowrap;
}
.btn:hover { filter: brightness(0.97); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.danger { background: transparent; color: var(--red); border-color: var(--border); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px; border: 0; cursor: pointer;
  background: var(--fill); display: inline-flex; align-items: center; justify-content: center; color: var(--text);
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.on { background: var(--accent-soft); color: var(--accent); }

.chart-box { position: relative; height: 260px; }
.chart-box.sm { height: 170px; }
.chart-box.donut { height: 220px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--text-2); margin-top: 10px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.legend .dot { width: 8px; height: 8px; margin-right: 6px; }

.list { display: flex; flex-direction: column; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { font-size: 12.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .right { text-align: right; }
.row.clickable { cursor: pointer; border-radius: 10px; }
.row.clickable:hover { background: var(--surface-2); }

.badge {
  width: 36px; height: 36px; border-radius: 11px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 13px;
}
.badge.round { border-radius: 50%; }
.tag { font-size: 11px; padding: 2px 7px; border-radius: 99px; background: var(--fill); color: var(--text-2); }

.progress { height: 10px; background: var(--fill); border-radius: 99px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.toolbar .spacer { flex: 1; }
.search {
  border: 1px solid var(--border); background: var(--surface); border-radius: 10px;
  padding: 8px 12px; min-width: 220px;
}

.group-head {
  display: flex; align-items: center; gap: 8px; justify-content: space-between;
  font-size: 13px; font-weight: 650; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.03em;
  padding: 4px 0 6px;
}

/* ---------- Tabela de atualização ---------- */
.update-table { width: 100%; border-collapse: collapse; }
.update-table th {
  text-align: left; font-size: 12px; font-weight: 600; color: var(--text-2);
  padding: 8px 8px; border-bottom: 1px solid var(--border);
}
.update-table td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.update-table tr.inst td { background: var(--surface-2); font-weight: 650; font-size: 13px; }
.update-table tr.dirty td { background: var(--accent-soft); }
.update-table .money-input { width: 150px; }
.update-table .flow { display: flex; gap: 6px; }
.update-table select { width: 110px; }

/* ---------- Formulários ---------- */
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 600; color: var(--text-2); }
.field .hint { font-size: 12px; color: var(--text-3); }
input[type=text], input[type=date], input[type=number], select, textarea, .money-input {
  border: 1px solid var(--border); background: var(--surface-2); border-radius: 10px;
  padding: 9px 11px; width: 100%; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.money-input { text-align: right; font-variant-numeric: tabular-nums; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border);
  background: var(--surface-2); border-radius: 99px; padding: 5px 10px; font-size: 12.5px; cursor: pointer;
}
.chip:hover { border-color: var(--accent); }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center;
  padding: 20px; z-index: 50; animation: fade .15s ease;
}
.modal {
  background: var(--surface); border-radius: 20px; width: 100%; max-width: 520px; max-height: calc(100vh - 40px);
  display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.modal.wide { max-width: 760px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px 8px; }
.modal-head h2 { margin: 0; font-size: 19px; }
.modal-body { padding: 8px 22px; overflow: auto; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 22px 18px; border-top: 1px solid var(--border); }
.modal-foot .left { margin-right: auto; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
  background: #1c1c1e; color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: all .2s ease; z-index: 60; max-width: 90vw;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.empty { text-align: center; padding: 56px 20px; }
.empty h2 { margin: 12px 0 8px; font-size: 24px; }
.empty p { color: var(--text-2); max-width: 520px; margin: 0 auto 22px; }
.empty .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

pre.code {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; overflow-x: auto; font-size: 12.5px; margin: 8px 0;
}

/* ---------- Celular: barra inferior ---------- */
@media (max-width: 900px) {
  .span-8, .span-7, .span-6, .span-5, .span-4 { grid-column: span 12; }
}
@media (max-width: 760px) {
  .sidebar {
    position: fixed; bottom: 0; top: auto; left: 0; right: 0; width: 100%; height: auto;
    flex-direction: row; padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    border-right: 0; border-top: 1px solid var(--border); z-index: 40;
  }
  .brand, .sidebar-foot { display: none; }
  .nav { flex-direction: row; width: 100%; justify-content: space-around; }
  .nav-item { flex-direction: column; gap: 2px; font-size: 10.5px; padding: 6px 4px; flex: 1; align-items: center; }
  .nav-item.active { background: none; }
  .topbar { padding: 16px 16px 4px; }
  .topbar h1 { font-size: 24px; }
  .view { padding: 8px 16px 96px; }
  .kpi-value { font-size: 28px; }
  .form-row { grid-template-columns: 1fr; }
  .search { min-width: 0; flex: 1; }
  .update-table thead { display: none; }
  .update-table tr:not(.inst) { display: grid; grid-template-columns: 1fr auto; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .update-table tr:not(.inst) td { border: 0; padding: 2px 4px; }
  .update-table td.last { grid-column: 1 / 2; }
  .update-table td.flowcell { grid-column: 1 / 3; }
  .update-table .money-input { width: 130px; }
  .modal-backdrop { align-items: flex-end; padding: 0; }
  .modal { border-radius: 20px 20px 0 0; max-height: 92vh; }
}

</style>

<script>
/* js/util.js */
/* Utilidades de formatação, datas e números (pt-BR). */
(function (g) {
  'use strict';
  const P = (g.Patrimonio = g.Patrimonio || {});
  const U = (P.util = {});

  const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  const pctFmt = new Intl.NumberFormat('pt-BR', { style: 'percent', minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const decFmt = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const MASK = 'R$ •••••';

  U.MASK = MASK;

  U.money = function (v, hidden) {
    if (hidden) return MASK;
    return brl.format(v || 0);
  };

  U.signedMoney = function (v, hidden) {
    if (hidden) return MASK;
    v = v || 0;
    const s = brl.format(Math.abs(v));
    if (v > 0.004) return '+' + s;
    if (v < -0.004) return '−' + s;
    return s;
  };

  /** "R$ 350 mil", "R$ 1,2 mi" — para eixos de gráficos. */
  U.compact = function (v) {
    const a = Math.abs(v || 0);
    const sign = v < 0 ? '−' : '';
    const short = (x) => new Intl.NumberFormat('pt-BR', { maximumFractionDigits: x < 10 ? 1 : 0 }).format(x);
    if (a >= 1e6) return sign + 'R$ ' + short(a / 1e6) + ' mi';
    if (a >= 1e3) return sign + 'R$ ' + short(a / 1e3) + ' mil';
    return sign + 'R$ ' + short(a);
  };

  /** `v` em fração (0,05 = 5%). */
  U.pct = function (v, signed) {
    if (v === null || v === undefined || !isFinite(v)) return '—';
    const s = pctFmt.format(v);
    return signed && v > 0.00005 ? '+' + s : s;
  };

  /** Número em formato editável: "1.234,56". */
  U.editable = function (v) {
    return v === null || v === undefined || v === '' ? '' : decFmt.format(v);
  };

  /** Converte "R$ 1.234,56", "1234,56", "1,234.56", "-500" em número. */
  U.parseNumber = function (raw) {
    if (raw === null || raw === undefined) return null;
    if (typeof raw === 'number') return isFinite(raw) ? raw : null;
    let s = String(raw).trim();
    if (!s) return null;
    let negative = false;
    if (/^\(.*\)$/.test(s) || s.includes('-') || s.includes('−')) negative = true;
    s = s.replace(/[^0-9.,]/g, '');
    if (!s) return null;
    const lastComma = s.lastIndexOf(',');
    const lastDot = s.lastIndexOf('.');
    if (lastComma >= 0 && lastDot >= 0) {
      s = lastComma > lastDot ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    } else if (lastComma >= 0) {
      s = s.split(',').length > 2 ? s.replace(/,/g, '') : s.replace(',', '.');
    } else if (lastDot >= 0) {
      const parts = s.split('.');
      if (parts.length > 2 || (parts.length === 2 && parts[1].length === 3)) s = s.replace(/\./g, '');
    }
    const v = Number(s);
    if (!isFinite(v)) return null;
    return negative ? -v : v;
  };

  /** Minúsculo, sem acentos e com espaços normalizados. */
  U.norm = function (s) {
    return String(s || '')
      .normalize('NFD')
      .replace(/[̀-ͯ]/g, '')
      .toLowerCase()
      .trim()
      .replace(/\s+/g, ' ');
  };

  U.uid = function () {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
  };

  U.escape = function (s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  };

  // ---------- Datas: sempre strings ISO "AAAA-MM-DD" (sem fuso) ----------

  const pad = (n) => String(n).padStart(2, '0');

  U.toISO = function (d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  };

  U.today = function () {
    return U.toISO(new Date());
  };

  U.isISO = function (s) {
    return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  };

  U.monthKey = function (iso) {
    return String(iso).slice(0, 7);
  };

  U.addMonths = function (mk, n) {
    let [y, m] = mk.split('-').map(Number);
    m += n;
    y += Math.floor((m - 1) / 12);
    m = ((((m - 1) % 12) + 12) % 12) + 1;
    return y + '-' + pad(m);
  };

  U.daysInMonth = function (mk) {
    const [y, m] = mk.split('-').map(Number);
    return new Date(y, m, 0).getDate();
  };

  U.monthStart = function (mk) {
    return mk + '-01';
  };

  U.monthEnd = function (mk) {
    return mk + '-' + pad(U.daysInMonth(mk));
  };

  U.monthRange = function (fromMk, toMk) {
    const out = [];
    let m = fromMk;
    let guard = 0;
    while (m <= toMk && guard++ < 1200) {
      out.push(m);
      m = U.addMonths(m, 1);
    }
    return out;
  };

  U.daysBetween = function (isoA, isoB) {
    const a = new Date(isoA + 'T12:00:00');
    const b = new Date(isoB + 'T12:00:00');
    return Math.round((b - a) / 86400000);
  };

  U.fmtDate = function (iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return d + '/' + m + '/' + y;
  };

  U.fmtShortDate = function (iso) {
    if (!iso) return '';
    const [, m, d] = iso.split('-');
    return d + '/' + m;
  };

  const MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const MONTHS_SHORT = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  U.MONTHS = MONTHS;
  U.MONTHS_SHORT = MONTHS_SHORT;

  U.fmtMonth = function (mk) {
    const [y, m] = mk.split('-').map(Number);
    return MONTHS_SHORT[m - 1] + '/' + String(y).slice(2);
  };

  U.fmtMonthLong = function (mk) {
    const [y, m] = mk.split('-').map(Number);
    const name = MONTHS[m - 1];
    return name.charAt(0).toUpperCase() + name.slice(1) + ' de ' + y;
  };

  U.debounce = function (fn, ms) {
    let t = null;
    return function () {
      const args = arguments;
      clearTimeout(t);
      t = setTimeout(() => fn.apply(null, args), ms);
    };
  };
})(typeof window !== 'undefined' ? window : globalThis);

/* js/model.js */
/* Catálogos (classes, categorias, bancos) e o armazenamento dos dados. */
(function (g) {
  'use strict';
  const P = (g.Patrimonio = g.Patrimonio || {});
  const U = P.util;

  P.ASSET_CLASSES = [
    { id: 'conta', title: 'Conta e Poupança', color: '#8E8E93', examples: 'Conta remunerada, poupança, caixinhas' },
    { id: 'rendaFixa', title: 'Renda Fixa', color: '#0A84FF', examples: 'CDB, LCI, LCA, LC, Debêntures, CRI/CRA' },
    { id: 'tesouro', title: 'Tesouro Direto', color: '#30B0C7', examples: 'Selic, IPCA+, Prefixado' },
    { id: 'acoes', title: 'Ações', color: '#34C759', examples: 'Ações da B3, ETFs' },
    { id: 'fiis', title: 'Fundos Imobiliários', color: '#FF9F0A', examples: 'FIIs e Fiagros' },
    { id: 'fundos', title: 'Fundos de Investimento', color: '#AF52DE', examples: 'Multimercado, DI, Ações' },
    { id: 'previdencia', title: 'Previdência', color: '#5E5CE6', examples: 'PGBL, VGBL' },
    { id: 'cripto', title: 'Criptomoedas', color: '#E6B800', examples: 'Bitcoin, Ethereum, stablecoins' },
    { id: 'exterior', title: 'Exterior', color: '#FF375F', examples: 'Stocks, REITs, BDRs' },
    { id: 'outros', title: 'Outros', color: '#A2845E', examples: 'Imóveis, COE, outros' },
  ];
  P.classById = function (id) {
    return P.ASSET_CLASSES.find((c) => c.id === id) || P.ASSET_CLASSES[P.ASSET_CLASSES.length - 1];
  };

  /** Reconhece a classe a partir de texto livre (importação de planilhas). */
  P.matchClass = function (text) {
    const t = U.norm(text);
    if (!t) return 'outros';
    const exact = P.ASSET_CLASSES.find((c) => c.id === text || U.norm(c.title) === t);
    if (exact) return exact.id;
    const rules = [
      ['tesouro', ['tesouro', 'selic', 'ntn', 'ltn']],
      ['fiis', ['fii', 'imobiliario', 'fiagro']],
      ['previdencia', ['previdencia', 'pgbl', 'vgbl']],
      ['cripto', ['cripto', 'bitcoin', 'btc', 'eth', 'crypto']],
      ['exterior', ['exterior', 'stock', 'reit', 'internacional', 'dolar', 'usd', 'bdr']],
      ['fundos', ['fundo', 'multimercado', 'fic', 'fim']],
      ['rendaFixa', ['renda fixa', 'cdb', 'lci', 'lca', 'debenture', 'cri', 'cra', 'rdb']],
      ['acoes', ['acao', 'acoes', 'etf', 'bolsa', 'renda variavel']],
      ['conta', ['conta', 'poupanca', 'caixinha', 'saldo', 'cofrinho']],
    ];
    for (const [id, keys] of rules) {
      if (keys.some((k) => t.includes(k))) return id;
    }
    return 'outros';
  };

  P.MOVEMENT_KINDS = [
    { id: 'aporte', title: 'Aporte', color: '#34C759', flowSign: 1, investedSign: 1 },
    { id: 'resgate', title: 'Resgate', color: '#FF3B30', flowSign: -1, investedSign: -1 },
    { id: 'provento', title: 'Provento', color: '#FF9F0A', flowSign: -1, investedSign: 0 },
  ];
  P.kindById = function (id) {
    return P.MOVEMENT_KINDS.find((k) => k.id === id) || P.MOVEMENT_KINDS[0];
  };

  P.CASH_CATEGORIES = [
    { id: 'salario', title: 'Salário', income: true, color: '#34C759' },
    { id: 'freelance', title: 'Freelance / Extra', income: true, color: '#30D158' },
    { id: 'rendimentos', title: 'Rendimentos', income: true, color: '#00C7BE' },
    { id: 'outrasReceitas', title: 'Outras receitas', income: true, color: '#64D2FF' },
    { id: 'moradia', title: 'Moradia', income: false, color: '#0A84FF' },
    { id: 'mercado', title: 'Mercado', income: false, color: '#FF9F0A' },
    { id: 'alimentacao', title: 'Restaurantes', income: false, color: '#FF6B35' },
    { id: 'transporte', title: 'Transporte', income: false, color: '#5E5CE6' },
    { id: 'saude', title: 'Saúde', income: false, color: '#FF375F' },
    { id: 'educacao', title: 'Educação', income: false, color: '#BF5AF2' },
    { id: 'lazer', title: 'Lazer', income: false, color: '#E6B800' },
    { id: 'compras', title: 'Compras', income: false, color: '#FF2D55' },
    { id: 'assinaturas', title: 'Assinaturas', income: false, color: '#AC8E68' },
    { id: 'contas', title: 'Contas da casa', income: false, color: '#30B0C7' },
    { id: 'viagem', title: 'Viagem', income: false, color: '#66D4CF' },
    { id: 'cartao', title: 'Fatura do cartão', income: false, color: '#1C1C1E' },
    { id: 'impostos', title: 'Impostos e taxas', income: false, color: '#8E8E93' },
    { id: 'pets', title: 'Pets', income: false, color: '#A2845E' },
    { id: 'outrosGastos', title: 'Outros gastos', income: false, color: '#636366' },
  ];
  P.CASH_CATEGORIES.forEach((c) => {
    c.builtin = true;
    c.parentId = null;
  });

  // Categorias e subcategorias criadas pelo usuário (ficam em data.customCategories).
  let customCategories = [];
  P.setCustomCategories = function (list) {
    customCategories = list || [];
  };
  P.customCategories = function () {
    return customCategories;
  };

  P.categoryById = function (id) {
    return (
      P.CASH_CATEGORIES.find((c) => c.id === id) ||
      customCategories.find((c) => c.id === id) ||
      P.CASH_CATEGORIES[P.CASH_CATEGORIES.length - 1]
    );
  };

  P.categoryExists = function (id) {
    return P.CASH_CATEGORIES.some((c) => c.id === id) || customCategories.some((c) => c.id === id);
  };

  /** Categorias principais (sem pai) de um tipo, na ordem: padrão e depois as criadas. */
  P.topCategories = function (income) {
    return P.CASH_CATEGORIES.filter((c) => c.income === income).concat(customCategories.filter((c) => c.income === income && !c.parentId));
  };

  P.subcategoriesOf = function (id) {
    return customCategories.filter((c) => c.parentId === id);
  };

  /** Lista plana para seletores: cada categoria seguida das suas subcategorias. */
  P.categoriesFor = function (income) {
    const out = [];
    P.topCategories(income).forEach((c) => {
      out.push(Object.assign({ depth: 0 }, c));
      P.subcategoriesOf(c.id).forEach((s) => out.push(Object.assign({ depth: 1 }, s)));
    });
    return out;
  };

  /** Categoria principal de uma subcategoria (ou a própria categoria). */
  P.rootCategory = function (id) {
    const c = P.categoryById(id);
    return c.parentId ? P.categoryById(c.parentId) : c;
  };

  /** "Moradia › Condomínio" */
  P.categoryLabel = function (id) {
    const c = P.categoryById(id);
    return c.parentId ? P.categoryById(c.parentId).title + ' › ' + c.title : c.title;
  };

  /** O lançamento da categoria `catId` pertence ao filtro `filterId` (inclui subcategorias)? */
  P.inCategory = function (catId, filterId) {
    return catId === filterId || P.categoryById(catId).parentId === filterId;
  };

  P.INSTITUTION_PRESETS = [
    ['Nubank', '#820AD1'], ['Itaú', '#EC7000'], ['Bradesco', '#CC092F'], ['Banco do Brasil', '#D4A900'],
    ['Caixa', '#005CA9'], ['Santander', '#EC0000'], ['Inter', '#FF7A00'], ['C6 Bank', '#3A3A3C'],
    ['XP Investimentos', '#1C1C1E'], ['BTG Pactual', '#0D2B5C'], ['Rico', '#FF5A00'], ['Clear', '#00A3E0'],
    ['NuInvest', '#9B4DCA'], ['Mercado Pago', '#00B1EA'], ['PicPay', '#21C25E'], ['Sicredi', '#3FA110'],
    ['Sicoob', '#003641'], ['Banco Pan', '#00AEEF'], ['Órama', '#1E9E8A'], ['Warren', '#E02B57'],
    ['Avenue', '#1D3CB5'], ['Binance', '#D4A20B'], ['Tesouro Direto', '#2E7D32'],
  ].map(([name, color]) => ({ name, color }));

  /** Siglas comuns → nome da instituição ("BB" → "Banco do Brasil"). */
  const INSTITUTION_ALIASES = {
    bb: 'Banco do Brasil', 'banco do brasil s.a.': 'Banco do Brasil', cef: 'Caixa', 'caixa economica': 'Caixa',
    'caixa economica federal': 'Caixa', xp: 'XP Investimentos', btg: 'BTG Pactual', c6: 'C6 Bank', nu: 'Nubank',
    'banco inter': 'Inter', 'clear corretora': 'Clear', mp: 'Mercado Pago',
  };
  P.institutionAlias = function (name) {
    const label = String(name || '').trim();
    return INSTITUTION_ALIASES[U.norm(label)] || label;
  };

  P.PALETTE = ['#5E5CE6', '#0A84FF', '#30B0C7', '#34C759', '#FF9F0A', '#FF375F', '#AF52DE', '#A2845E'];

  // ---------------------------------------------------------------------
  // Armazenamento
  // ---------------------------------------------------------------------

  P.emptyData = function () {
    return {
      version: 1,
      institutions: [],
      assets: [],
      snapshots: [],
      movements: [],
      transactions: [],
      customCategories: [],
      settings: { goal: 0, hideValues: false, categoryRules: {} },
      benchmarks: { cdi: {}, ipca: {}, updated: null },
    };
  };

  /** Garante a estrutura esperada (dados antigos, importados ou vindos da planilha). */
  P.normalizeData = function (raw) {
    const d = P.emptyData();
    if (!raw || typeof raw !== 'object') return d;
    const num = (v) => U.parseNumber(v) || 0;
    const str = (v) => (v === null || v === undefined ? '' : String(v));
    const date = (v) => (U.isISO(str(v).slice(0, 10)) ? str(v).slice(0, 10) : null);

    d.institutions = (raw.institutions || [])
      .filter((i) => i && i.id)
      .map((i) => ({ id: str(i.id), name: str(i.name) || 'Sem nome', color: str(i.color) || '#8E8E93' }));
    d.assets = (raw.assets || [])
      .filter((a) => a && a.id)
      .map((a) => ({
        id: str(a.id),
        name: str(a.name) || 'Sem nome',
        classId: P.ASSET_CLASSES.some((c) => c.id === a.classId) ? a.classId : 'outros',
        institutionId: str(a.institutionId),
        ticker: str(a.ticker),
        indexer: str(a.indexer),
        maturity: date(a.maturity),
        notes: str(a.notes),
        archived: a.archived === true || a.archived === 'TRUE' || a.archived === 'true',
        createdAt: date(a.createdAt) || U.today(),
      }));
    d.snapshots = (raw.snapshots || [])
      .filter((s) => s && s.id && date(s.date))
      .map((s) => ({ id: str(s.id), assetId: str(s.assetId), date: date(s.date), value: num(s.value) }));
    d.movements = (raw.movements || [])
      .filter((m) => m && m.id && date(m.date))
      .map((m) => ({
        id: str(m.id),
        assetId: str(m.assetId),
        date: date(m.date),
        kind: P.MOVEMENT_KINDS.some((k) => k.id === m.kind) ? m.kind : 'aporte',
        amount: Math.abs(num(m.amount)),
        note: str(m.note),
      }));
    // Categorias criadas pelo usuário antes dos lançamentos, que podem usá-las.
    const topIds = new Set(P.CASH_CATEGORIES.map((c) => c.id));
    const rawCats = (raw.customCategories || []).filter((c) => c && c.id && c.title);
    rawCats.filter((c) => !c.parentId).forEach((c) => topIds.add(str(c.id)));
    d.customCategories = rawCats.map((c) => {
      const parentId = c.parentId && topIds.has(str(c.parentId)) && str(c.parentId) !== str(c.id) ? str(c.parentId) : null;
      return { id: str(c.id), title: str(c.title).trim(), income: c.income === true || c.income === 'true', color: str(c.color) || '#8E8E93', parentId };
    });
    // Subcategoria herda o tipo (receita/despesa) da categoria principal.
    d.customCategories.forEach((c) => {
      if (!c.parentId) return;
      const parent = P.CASH_CATEGORIES.find((x) => x.id === c.parentId) || d.customCategories.find((x) => x.id === c.parentId);
      if (parent) c.income = parent.income;
    });
    P.setCustomCategories(d.customCategories);

    d.transactions = (raw.transactions || [])
      .filter((t) => t && t.id && date(t.date))
      .map((t) => {
        const cat = P.categoryById(t.category);
        const out = { id: str(t.id), date: date(t.date), amount: Math.abs(num(t.amount)), category: cat.id, income: cat.income, note: str(t.note) };
        if (t.ref) out.ref = str(t.ref);
        if (t.group) out.group = str(t.group);
        return out;
      });
    const s = raw.settings || {};
    d.settings = { goal: num(s.goal), hideValues: s.hideValues === true || s.hideValues === 'true', categoryRules: s.categoryRules && typeof s.categoryRules === 'object' ? s.categoryRules : {}, cardItemized: s.cardItemized === true || s.cardItemized === 'true', installmentRules: s.installmentRules && typeof s.installmentRules === 'object' ? s.installmentRules : {} };
    if (s.plan && typeof s.plan === 'object') d.settings.plan = s.plan;
    if (s.securityDismissed === true) d.settings.securityDismissed = true;
    const b = raw.benchmarks || {};
    d.benchmarks = { cdi: b.cdi || {}, ipca: b.ipca || {}, updated: b.updated || null };
    return d;
  };

  /**
   * Cria o repositório de dados. `backend` precisa ter:
   *   load(): Promise<objeto|null>
   *   save(objeto): Promise
   *   fetchSeries(codigo): Promise<[{data, valor}]>   (opcional)
   */
  P.createStore = function (backend) {
    let data = P.emptyData();
    const listeners = [];
    let status = 'idle';
    let pending = null;

    const store = {
      backend,
      get data() {
        return data;
      },
      get status() {
        return status;
      },
      onChange(fn) {
        listeners.push(fn);
      },
      async load() {
        const raw = await store.backend.load();
        data = P.normalizeData(raw);
        emit();
      },
      commit() {
        emit();
        scheduleSave();
      },
      replaceAll(newData) {
        data = P.normalizeData(newData);
        store.commit();
      },
      wipe() {
        const benchmarks = data.benchmarks;
        data = P.emptyData();
        data.benchmarks = benchmarks;
        P.setCustomCategories(data.customCategories);
        store.commit();
      },
      async flush() {
        if (pending) {
          clearTimeout(pending);
          pending = null;
          await doSave();
        }
      },

      // ---- Instituições ----
      institution(id) {
        return data.institutions.find((i) => i.id === id) || null;
      },
      saveInstitution(inst) {
        if (inst.id) {
          Object.assign(store.institution(inst.id) || {}, inst);
        } else {
          inst.id = U.uid();
          data.institutions.push(inst);
        }
        store.commit();
        return inst;
      },
      findOrCreateInstitution(name, autoCommit) {
        const typed = String(name || '').trim() || 'Sem instituição';
        let inst = data.institutions.find((i) => U.norm(i.name) === U.norm(typed));
        if (inst) return { inst, created: false };
        const label = P.institutionAlias(typed);
        const key = U.norm(label);
        inst = data.institutions.find((i) => U.norm(i.name) === key);
        if (inst) return { inst, created: false };
        const preset = P.INSTITUTION_PRESETS.find((p) => U.norm(p.name) === key);
        inst = { id: U.uid(), name: label, color: preset ? preset.color : P.PALETTE[data.institutions.length % P.PALETTE.length] };
        data.institutions.push(inst);
        if (autoCommit !== false) store.commit();
        return { inst, created: true };
      },
      deleteInstitution(id) {
        const assetIds = data.assets.filter((a) => a.institutionId === id).map((a) => a.id);
        assetIds.forEach((aid) => removeAsset(aid));
        data.institutions = data.institutions.filter((i) => i.id !== id);
        store.commit();
      },

      // ---- Ativos ----
      asset(id) {
        return data.assets.find((a) => a.id === id) || null;
      },
      saveAsset(asset, initialValue, initialDate, autoCommit) {
        if (asset.id && store.asset(asset.id)) {
          Object.assign(store.asset(asset.id), asset);
        } else {
          asset.id = U.uid();
          asset.createdAt = asset.createdAt || U.today();
          asset.archived = !!asset.archived;
          data.assets.push(asset);
          if (initialValue && initialValue > 0) {
            const d = initialDate || U.today();
            store.recordBalance(asset.id, d, initialValue, false);
            store.recordMovement(asset.id, 'aporte', initialValue, d, 'Posição inicial', false);
          }
        }
        if (autoCommit !== false) store.commit();
        return asset;
      },
      deleteAsset(id) {
        removeAsset(id);
        store.commit();
      },
      snapshotsOf(assetId) {
        return data.snapshots.filter((s) => s.assetId === assetId).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
      },
      movementsOf(assetId) {
        return data.movements.filter((m) => m.assetId === assetId).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
      },
      currentValue(assetId) {
        const s = store.snapshotsOf(assetId);
        return s.length ? s[s.length - 1].value : 0;
      },
      lastUpdate(assetId) {
        const s = store.snapshotsOf(assetId);
        return s.length ? s[s.length - 1].date : null;
      },
      invested(assetId) {
        return store.movementsOf(assetId).reduce((acc, m) => acc + m.amount * P.kindById(m.kind).investedSign, 0);
      },
      proventos(assetId) {
        return store.movementsOf(assetId).filter((m) => m.kind === 'provento').reduce((acc, m) => acc + m.amount, 0);
      },
      gain(assetId) {
        return store.currentValue(assetId) - store.invested(assetId) + store.proventos(assetId);
      },

      /** Registra o saldo do dia (substitui se já houver saldo na mesma data). */
      recordBalance(assetId, date, value, autoCommit) {
        const existing = data.snapshots.find((s) => s.assetId === assetId && s.date === date);
        if (existing) existing.value = value;
        else data.snapshots.push({ id: U.uid(), assetId, date, value });
        if (autoCommit !== false) store.commit();
      },
      recordMovement(assetId, kind, amount, date, note, autoCommit) {
        if (!(amount > 0)) return;
        data.movements.push({ id: U.uid(), assetId, date, kind, amount, note: note || '' });
        if (autoCommit !== false) store.commit();
      },
      deleteSnapshot(id) {
        data.snapshots = data.snapshots.filter((s) => s.id !== id);
        store.commit();
      },
      deleteMovement(id) {
        data.movements = data.movements.filter((m) => m.id !== id);
        store.commit();
      },

      // ---- Orçamento ----
      saveTransaction(t) {
        const cat = P.categoryById(t.category);
        t.income = cat.income;
        if (t.id) {
          Object.assign(data.transactions.find((x) => x.id === t.id) || {}, t);
        } else {
          t.id = U.uid();
          data.transactions.push(t);
        }
        store.commit();
      },
      deleteTransaction(id) {
        data.transactions = data.transactions.filter((t) => t.id !== id);
        store.commit();
      },

      // ---- Preferências ----
      setSetting(key, value) {
        data.settings[key] = value;
        store.commit();
      },
      // ---- Categorias personalizadas ----
      saveCategory(cat) {
        const title = String(cat.title || '').trim();
        if (!title) throw new Error('Informe o nome da categoria.');
        let parentId = cat.parentId || null;
        let income = !!cat.income;
        if (parentId) {
          const parent = P.categoryById(parentId);
          if (!P.categoryExists(parentId) || parent.parentId) throw new Error('Subcategorias só podem ficar dentro de uma categoria principal.');
          income = parent.income;
        }
        const clash = P.categoriesFor(income).find((c) => U.norm(c.title) === U.norm(title) && (c.parentId || null) === parentId && c.id !== cat.id);
        if (clash) throw new Error('Já existe uma categoria com esse nome.');
        const list = data.customCategories;
        let saved;
        if (cat.id && list.find((c) => c.id === cat.id)) {
          saved = list.find((c) => c.id === cat.id);
          if (P.subcategoriesOf(saved.id).length && parentId) throw new Error('Uma categoria com subcategorias não pode virar subcategoria.');
          Object.assign(saved, { title, income, color: cat.color || saved.color, parentId });
        } else {
          saved = { id: 'c_' + U.uid(), title, income, color: cat.color || (parentId ? P.categoryById(parentId).color : '#8E8E93'), parentId };
          list.push(saved);
        }
        P.setCustomCategories(list);
        store.commit();
        return saved;
      },
      /** Exclui a categoria (e suas subcategorias) movendo os lançamentos para `moveTo`. */
      deleteCategory(id, moveTo) {
        const ids = new Set([id].concat(P.subcategoriesOf(id).map((c) => c.id)));
        const target = moveTo && !ids.has(moveTo) ? moveTo : P.categoryById(id).income ? 'outrasReceitas' : 'outrosGastos';
        let moved = 0;
        data.transactions.forEach((t) => {
          if (ids.has(t.category)) {
            t.category = target;
            t.income = P.categoryById(target).income;
            moved++;
          }
        });
        data.customCategories = data.customCategories.filter((c) => !ids.has(c.id));
        const rules = data.settings.categoryRules || {};
        Object.keys(rules).forEach((k) => ids.has(rules[k]) && (rules[k] = target));
        const irules = data.settings.installmentRules || {};
        Object.keys(irules).forEach((k) => ids.has(irules[k]) && (irules[k] = target));
        P.setCustomCategories(data.customCategories);
        store.commit();
        return moved;
      },
      /** Aplica a categoria a todos os lançamentos (parcelas) do grupo e lembra para as próximas. */
      applyCategoryToGroup(group, categoryId, autoCommit) {
        if (!group) return 0;
        const cat = P.categoryById(categoryId);
        let changed = 0;
        data.transactions.forEach((t) => {
          if (t.group === group && t.category !== cat.id) {
            t.category = cat.id;
            t.income = cat.income;
            changed++;
          }
        });
        data.settings.installmentRules = data.settings.installmentRules || {};
        data.settings.installmentRules[group] = cat.id;
        if (autoCommit !== false) store.commit();
        return changed;
      },
      categoryUsage(id) {
        return data.transactions.filter((t) => P.inCategory(t.category, id)).length;
      },

      setBenchmarks(cdi, ipca) {
        data.benchmarks = { cdi, ipca, updated: new Date().toISOString() };
        store.commit();
      },
    };

    function removeAsset(id) {
      data.assets = data.assets.filter((a) => a.id !== id);
      data.snapshots = data.snapshots.filter((s) => s.assetId !== id);
      data.movements = data.movements.filter((m) => m.assetId !== id);
    }

    function emit() {
      listeners.forEach((fn) => {
        try {
          fn(data, status);
        } catch (e) {
          console.error(e);
        }
      });
    }

    function setStatus(s) {
      status = s;
      listeners.forEach((fn) => {
        try {
          fn(data, status, true);
        } catch (e) {
          console.error(e);
        }
      });
    }

    function scheduleSave() {
      setStatus('pending');
      clearTimeout(pending);
      pending = setTimeout(() => {
        pending = null;
        doSave();
      }, 700);
    }

    async function doSave() {
      setStatus('saving');
      try {
        await store.backend.save(data);
        setStatus('saved');
      } catch (e) {
        console.error(e);
        setStatus('error');
      }
    }

    return store;
  };
})(typeof window !== 'undefined' ? window : globalThis);

/* js/analytics.js */
/* Cálculos da carteira: evolução, rentabilidade (Modified Dietz), alocação. */
(function (g) {
  'use strict';
  const P = (g.Patrimonio = g.Patrimonio || {});
  const U = P.util;

  /**
   * @param {object} data  dados normalizados (P.normalizeData)
   * @param {string} [today] data ISO de referência (padrão: hoje)
   */
  function Analytics(data, today) {
    this.today = today || U.today();
    const instById = {};
    data.institutions.forEach((i) => (instById[i.id] = i));
    const byAsset = {};
    data.assets.forEach((a) => {
      const inst = instById[a.institutionId];
      byAsset[a.id] = {
        id: a.id,
        name: a.name,
        classId: a.classId,
        archived: a.archived,
        institutionId: a.institutionId,
        institutionName: inst ? inst.name : 'Sem instituição',
        institutionColor: inst ? inst.color : '#8E8E93',
        snaps: [],
        flows: [],
      };
    });
    data.snapshots.forEach((s) => byAsset[s.assetId] && byAsset[s.assetId].snaps.push(s));
    data.movements.forEach((m) => byAsset[m.assetId] && byAsset[m.assetId].flows.push(m));
    const cmp = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    this.assets = Object.values(byAsset);
    this.assets.forEach((a) => {
      a.snaps.sort(cmp);
      a.flows.sort(cmp);
    });
  }

  /** Saldo do ativo na data (último saldo informado até ela, inclusive). */
  Analytics.prototype.valueOf = function (asset, iso) {
    let v = 0;
    for (const s of asset.snaps) {
      if (s.date <= iso) v = s.value;
      else break;
    }
    return v;
  };

  Analytics.prototype.total = function (iso) {
    iso = iso || this.today;
    return this.assets.reduce((acc, a) => acc + this.valueOf(a, iso), 0);
  };

  Analytics.prototype.invested = function (iso) {
    iso = iso || this.today;
    let v = 0;
    this.assets.forEach((a) =>
      a.flows.forEach((f) => {
        if (f.date <= iso) v += f.amount * P.kindById(f.kind).investedSign;
      })
    );
    return v;
  };

  Analytics.prototype.proventos = function (fromIso, toIso) {
    fromIso = fromIso || '0000-00-00';
    toIso = toIso || this.today;
    let v = 0;
    this.assets.forEach((a) =>
      a.flows.forEach((f) => {
        if (f.kind === 'provento' && f.date >= fromIso && f.date <= toIso) v += f.amount;
      })
    );
    return v;
  };

  Analytics.prototype.firstDate = function () {
    let first = null;
    this.assets.forEach((a) => {
      a.snaps.concat(a.flows).forEach((x) => {
        if (!first || x.date < first) first = x.date;
      });
    });
    return first;
  };

  /** Meses exibidos: os `limit` últimos (ou todos) desde o primeiro registro. */
  Analytics.prototype.months = function (limit) {
    const first = this.firstDate();
    if (!first) return [];
    const all = U.monthRange(U.monthKey(first), U.monthKey(this.today));
    return limit && all.length > limit ? all.slice(all.length - limit) : all;
  };

  Analytics.prototype.cutoff = function (mk) {
    const end = U.monthEnd(mk);
    return end < this.today ? end : this.today;
  };

  /** Mesma análise restrita a parte da carteira (filtro por classe, instituição ou investimentos). */
  Analytics.prototype.subset = function (pred) {
    const s = Object.create(Analytics.prototype);
    s.today = this.today;
    s.assets = this.assets.filter(pred);
    return s;
  };

  Analytics.prototype.evolution = function (limit) {
    return this.months(limit).map((mk) => {
      const cut = this.cutoff(mk);
      const byClass = {};
      const byInst = {};
      const byAsset = {};
      let total = 0;
      this.assets.forEach((a) => {
        const v = this.valueOf(a, cut);
        total += v;
        byClass[a.classId] = (byClass[a.classId] || 0) + v;
        const ik = a.institutionId || '_';
        byInst[ik] = (byInst[ik] || 0) + v;
        byAsset[a.id] = v;
      });
      return { month: mk, total, invested: this.invested(cut), byClass, byInst, byAsset };
    });
  };

  Analytics.prototype.performanceFor = function (mk) {
    const start = U.monthStart(mk);
    const prevEnd = U.monthEnd(U.addMonths(mk, -1));
    const cut = this.cutoff(mk);
    const startValue = this.total(prevEnd);
    const endValue = this.total(cut);
    const dim = U.daysInMonth(mk);
    let aportes = 0, resgates = 0, proventos = 0, netFlow = 0, weighted = 0;
    this.assets.forEach((a) =>
      a.flows.forEach((f) => {
        if (f.date < start || f.date > U.monthEnd(mk)) return;
        if (f.kind === 'aporte') aportes += f.amount;
        else if (f.kind === 'resgate') resgates += f.amount;
        else proventos += f.amount;
        const signed = f.amount * P.kindById(f.kind).flowSign;
        netFlow += signed;
        const day = Number(f.date.slice(8, 10));
        // Fração do mês em que o dinheiro ficou aplicado.
        const w = Math.max(0, Math.min(1, (dim - day + 0.5) / dim));
        weighted += signed * w;
      })
    );
    const gain = endValue - startValue - netFlow;
    const base = startValue + weighted;
    return {
      month: mk,
      startValue,
      endValue,
      aportes,
      resgates,
      proventos,
      netContribution: aportes - resgates,
      gain,
      rate: base > 0.01 ? gain / base : null,
    };
  };

  Analytics.prototype.performance = function (limit) {
    return this.months(limit).map((mk) => this.performanceFor(mk));
  };

  /** Rentabilidade acumulada (composta). `rates`: [{month, rate}] */
  Analytics.cumulative = function (rates) {
    let acc = 1;
    const out = [];
    rates.forEach((r) => {
      if (r.rate === null || r.rate === undefined) return;
      acc *= 1 + r.rate;
      out.push({ month: r.month, value: acc - 1 });
    });
    return out;
  };

  function slices(map) {
    const list = Object.values(map).filter((s) => s.value > 0.004);
    const total = list.reduce((acc, s) => acc + s.value, 0);
    if (!total) return [];
    return list.map((s) => Object.assign(s, { share: s.value / total })).sort((a, b) => b.value - a.value);
  }

  Analytics.prototype.allocationByClass = function (iso) {
    iso = iso || this.today;
    const map = {};
    this.assets.forEach((a) => {
      const c = P.classById(a.classId);
      map[c.id] = map[c.id] || { key: c.id, label: c.title, color: c.color, value: 0 };
      map[c.id].value += this.valueOf(a, iso);
    });
    return slices(map);
  };

  Analytics.prototype.allocationByInstitution = function (iso) {
    iso = iso || this.today;
    const map = {};
    this.assets.forEach((a) => {
      const k = a.institutionId || '_';
      map[k] = map[k] || { key: k, label: a.institutionName, color: a.institutionColor, value: 0 };
      map[k].value += this.valueOf(a, iso);
    });
    return slices(map);
  };

  /** Meses estimados para atingir a meta. */
  Analytics.monthsToReach = function (goal, current, monthly, rate, max) {
    max = max || 600;
    if (current >= goal) return 0;
    let v = current;
    for (let m = 1; m <= max; m++) {
      v = v * (1 + rate) + monthly;
      if (v >= goal) return m;
    }
    return null;
  };

  P.Analytics = Analytics;
})(typeof window !== 'undefined' ? window : globalThis);

/* js/csv.js */
/* Importação e exportação de planilhas CSV (Excel / Google Planilhas). */
(function (g) {
  'use strict';
  const P = (g.Patrimonio = g.Patrimonio || {});
  const U = P.util;
  const CSV = (P.csv = {});

  CSV.detectDelimiter = function (line) {
    const counts = [';', '\t', ','].map((d) => [d, line.split(d).length - 1]);
    counts.sort((a, b) => b[1] - a[1]);
    return counts[0][1] > 0 ? counts[0][0] : ';';
  };

  /** Parser CSV com suporte a campos entre aspas. */
  CSV.parse = function (text) {
    text = String(text || '').replace(/^﻿/, '').replace(/\r\n?/g, '\n');
    const firstLine = text.split('\n').find((l) => l.trim()) || '';
    const delim = CSV.detectDelimiter(firstLine);
    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;
    const src = text + '\n';
    for (let i = 0; i < src.length; i++) {
      const ch = src[i];
      if (inQuotes) {
        if (ch === '"') {
          if (src[i + 1] === '"') {
            field += '"';
            i++;
          } else inQuotes = false;
        } else field += ch;
      } else if (ch === '"') inQuotes = true;
      else if (ch === delim) {
        row.push(field.trim());
        field = '';
      } else if (ch === '\n') {
        row.push(field.trim());
        field = '';
        if (row.some((c) => c !== '')) rows.push(row);
        row = [];
      } else field += ch;
    }
    return rows;
  };

  /** "31/01/2026", "2026-01-31", "31/01/26" → "2026-01-31". */
  CSV.parseDate = function (raw) {
    const s = String(raw || '').trim();
    let m;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return valid(+m[1], +m[2], +m[3]);
    if ((m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})$/))) {
      let y = +m[3];
      if (y < 100) y += 2000;
      return valid(y, +m[2], +m[1]);
    }
    return null;
  };

  function valid(y, mo, d) {
    if (mo < 1 || mo > 12 || d < 1) return null;
    const mk = y + '-' + String(mo).padStart(2, '0');
    if (d > U.daysInMonth(mk)) return null;
    return mk + '-' + String(d).padStart(2, '0');

    asset: ['ativo', 'investimento', 'nome', 'produto', 'aplicacao', 'descricao'],
    assetClass: ['classe', 'tipo', 'categoria', 'classe de ativo'],
    balance: ['saldo', 'valor', 'valor atual', 'saldo atual', 'patrimonio', 'posicao'],
    aporte: ['aporte', 'aportes', 'aplicado', 'deposito'],
    resgate: ['resgate', 'resgates', 'retirada', 'saque'],
    provento: ['proventos', 'provento', 'dividendos', 'rendimentos pagos', 'juros recebidos'],

    }

    if (map.date === undefined) {
      rows.slice(1).forEach((row) => {
        const asset = resolveAsset(row);

        touched.add(asset.id);
        monthCols.forEach(([i, iso]) => {

      rows.slice(1).forEach((row) => {

/*
 * "Onde aportar": alocação-alvo por classe, divisão do aporte do mês, projeção do prazo da meta
 * e sugestões de investimentos. Tudo é estimativa educativa, não recomendação de investimento.

(function (g) {
  'use strict';
  const P = (g.Patrimonio = g.Patrimonio || {});
  const U = P.util;
  const PL = (P.planner = {});

  /** Alocação-alvo (% por classe) de cada perfil. */
  PL.PROFILES = {
    conservador: { title: 'Conservador', targets: { conta: 10, rendaFixa: 45, tesouro: 25, fiis: 7, acoes: 5, exterior: 8 } },
    moderado: { title: 'Moderado', targets: { conta: 5, rendaFixa: 35, tesouro: 20, fiis: 10, acoes: 15, exterior: 12, cripto: 3 } },
    arrojado: { title: 'Arrojado', targets: { conta: 5, rendaFixa: 20, tesouro: 15, fiis: 15, acoes: 25, exterior: 15, cripto: 5 } },
  };

  /** Rentabilidade anual esperada por classe, a partir do CDI (premissa simples e editável). */
  PL.defaultReturns = function (cdi) {
    const c = cdi > 0 ? cdi : 0.11;
    return {
      conta: c * 0.7,
      rendaFixa: c,
      tesouro: c * 1.02,
      fundos: c,
      previdencia: c * 0.95,
      fiis: c + 0.01,
      acoes: c + 0.03,
      exterior: c + 0.02,
      cripto: c + 0.05,
      outros: c * 0.9,
    };
  };

  /** CDI acumulado dos últimos 12 meses disponíveis (taxa anual), ou null. */
  PL.cdiLast12 = function (benchmarks) {
    const cdi = (benchmarks && benchmarks.cdi) || {};
    const months = Object.keys(cdi).sort().slice(-12);
    if (months.length < 6) return null;
    const acc = months.reduce((a, m) => a * (1 + cdi[m]), 1);
    return Math.pow(acc, 12 / months.length) - 1;
  };

  const monthly = (annual) => Math.pow(1 + annual, 1 / 12) - 1;

  /** Normaliza os alvos (em %) para frações que somam 1. */
  PL.normalizeTargets = function (targets) {
    const out = {};
    let sum = 0;
    Object.keys(targets || {}).forEach((k) => {
      const v = Number(targets[k]) || 0;
      if (v > 0) {
        out[k] = v;
        sum += v;
      }
    });
    if (sum <= 0) return {};
    Object.keys(out).forEach((k) => (out[k] /= sum));
    return out;
  };

  /**
   * Divide `amount` entre as classes para aproximar a carteira do alvo, sem vender nada:
   * primeiro cobre o que falta em cada classe abaixo do alvo; se sobrar, segue os pesos do alvo.
   * values: {classe: R$}; weights: {classe: fração}.
   */
  PL.recommend = function (values, weights, amount) {
    const out = {};
    if (!(amount > 0)) return out;
    const keys = Object.keys(weights).filter((k) => weights[k] > 0);
    if (!keys.length) return out;
    const total = Object.values(values).reduce((a, v) => a + (v > 0 ? v : 0), 0) + amount;
    const deficit = {};
    let D = 0;
    keys.forEach((k) => {
      deficit[k] = Math.max(0, weights[k] * total - (values[k] || 0));
      D += deficit[k];
    });
    keys.forEach((k) => {
      if (D <= 1e-9) out[k] = amount * weights[k];

   * Meses até `goal`. A cada mês a carteira rende (taxa da classe) e recebe o aporte:

  PL.simulate = function (values, amount, returns, goal, weights, max) {

    const rates = {};
    Object.keys(returns).forEach((k) => (rates[k] = monthly(returns[k])));

  /** Ideias por classe, para quem ainda não tem nada nela. Exemplos genéricos, não indicação. */
  PL.IDEAS = {
    conta: [{ title: 'Reserva de emergência com liquidez diária', why: 'CDB de liquidez diária, Tesouro Selic ou conta remunerada: 6 a 12 meses de gastos à mão.' }],
    rendaFixa: [
      { title: 'CDB, LCI e LCA acima de 100% do CDI', why: 'Bancos médios pagam mais e o FGC cobre até R$ 250 mil por CPF e instituição. LCI/LCA são isentas de IR.' },
      { title: 'Debêntures incentivadas, CRI e CRA', why: 'Isentos de IR para pessoa física; prazos mais longos e sem FGC, por isso diversifique entre emissores.' },
    ],
    tesouro: [
      { title: 'Tesouro IPCA+', why: 'Protege o poder de compra no longo prazo (inflação + juro real). Bom para a meta de patrimônio.' },
      { title: 'Tesouro Selic', why: 'Liquidez diária e baixo risco: alternativa à poupança e à conta corrente.' },
    ],
    fundos: [{ title: 'Fundos multimercado', why: 'Gestão profissional que combina juros, câmbio e bolsa; compare taxa de administração e histórico.' }],
    previdencia: [{ title: 'Previdência PGBL ou VGBL', why: 'PGBL deduz até 12% da renda tributável para quem faz a declaração completa; prefira fundos de taxa baixa.' }],
    fiis: [{ title: 'Fundos imobiliários (FIIs)', why: 'Renda mensal isenta de IR. Um ETF de FIIs (ex.: XFIX11) ou 5 a 10 FIIs de segmentos diferentes diversificam o risco.' }],
    acoes: [{ title: 'ETF de ações brasileiras', why: 'Um ETF do Ibovespa (ex.: BOVA11) ou de dividendos (ex.: DIVO11) dá diversificação com um único ativo.' }],
    exterior: [{ title: 'ETF de ações globais', why: 'Dolariza parte do patrimônio. Ex.: IVVB11 (S&P 500) na B3, ou ETFs no exterior via corretora internacional.' }],
    cripto: [{ title: 'Pequena parcela em cripto', why: 'Até 5% da carteira, de preferência via ETF de bitcoin na B3 (ex.: HASH11). Volatilidade alta.' }],

    const active = an.assets.filter((a) => !a.archived);
    const values = {};

    const p12 = an.performance(12);
    const avgNet = p12.length ? p12.reduce((a, p) => a + p.netContribution, 0) / p12.length : 0;
    const suggestedAmount = avgNet > 0 ? Math.round(avgNet / 50) * 50 : 0;
    const amount = plan.monthly > 0 ? plan.monthly : suggestedAmount;
    const split = PL.recommend(values, weights, amount);

    const classIds = P.ASSET_CLASSES.map((c) => c.id).filter((id) => values[id] > 0 || weights[id] > 0);
    const rows = classIds.map((id) => ({
      classId: id,
      value: values[id] || 0,
      share: total > 0 ? (values[id] || 0) / total : 0,
      target: weights[id] || 0,
      aporte: split[id] || 0,
      holdings: active.filter((a) => a.classId === id).sort((x, y) => an.valueOf(y, an.today) - an.valueOf(x, an.today)),
    }));

    const expected = (w) => Object.keys(w).reduce((acc, k) => acc + w[k] * (returns[k] || 0), 0);
    const currentWeights = {};
    Object.keys(values).forEach((k) => (currentWeights[k] = total > 0 ? values[k] / total : 0));

    // Projeção da meta.
    const goal = (data.settings && data.settings.goal) || 0;

    if (goal > 0 && total < goal) {
      const keep = PL.simulate(values, amount, returns, goal, null);
      const follow = PL.simulate(values, amount, returns, goal, weights);
      const more = amount > 0 ? PL.simulate(values, amount * 1.25, returns, goal, weights) : null;

      const reserve = (weights.conta || 0) * total;

      if (idle >= 1000) {
        const moved = Object.assign({}, values);
        moved.conta -= idle;
        moved.rendaFixa = (moved.rendaFixa || 0) + idle;
        idleMonths = PL.simulate(moved, amount, returns, goal, weights);

      projection = { goal, keep, follow, more, moreAmount: amount * 1.25, idle, idleMonths };
    }

    const suggestions = rows
      .filter((r) => r.aporte >= Math.max(1, amount * 0.02) || (r.target > 0 && !r.holdings.length))
      .sort((a, b) => b.aporte - a.aporte)
      .map((r) => ({
        classId: r.classId,
        aporte: r.aporte,
        existing: r.holdings.slice(0, 3).map((a) => ({ id: a.id, name: a.name, institution: a.institutionName })),
        ideas: r.holdings.length ? [] : PL.IDEAS[r.classId] || [],
      }));
    const missing = P.ASSET_CLASSES.filter((c) => !(values[c.id] > 0) && PL.IDEAS[c.id] && PL.IDEAS[c.id].length && !(weights[c.id] > 0)).map((c) => c.id);

    const alerts = [];
    const byInst = {};
    active.forEach((a) => {
      const t = U.norm(a.name);
      const covered = a.classId === 'conta' || (a.classId === 'rendaFixa' && !/debenture|cri\b|cra\b|fundo/.test(t));

      const k = a.institutionId || '_';

      byInst[k].value += an.valueOf(a, an.today);

    });
    active.forEach((a) => {
      const v = an.valueOf(a, an.today);
      if (total > 0 && v / total > 0.3) alerts.push({ kind: 'concentration', text: a.name + ' representa ' + U.pct(v / total) + ' da carteira. Concentração alta em um único investimento.' });
    });
    if (total > 0 && (values.conta || 0) / total > (weights.conta || 0) + 0.05 && (values.conta || 0) > 1000) {
      alerts.push({ kind: 'idle', text: U.money(values.conta) + ' (' + U.pct(values.conta / total) + ') estão em conta e poupança, acima da reserva do perfil (' + U.pct(weights.conta || 0) + '). Esse dinheiro rende menos que a renda fixa.' });

      profile,
      profileTitle: profile === 'custom' ? 'Personalizado' : PL.PROFILES[profile].title,
      weights,
      returns,
      cdi,
      total,
      amount,
      suggestedAmount,
      rows,
      expectedNow: expected(currentWeights),
      expectedTarget: expected(weights),
      projection,
      suggestions,
      missing,
      alerts,
    };
  };
})(typeof window !== 'undefined' ? window : globalThis);

/* js/vault.js */
/*
 * Acesso com usuário e senha. Os dados são gravados criptografados (AES-256-GCM) com uma chave
 * derivada do usuário e da senha (PBKDF2-SHA-256). Sem a senha não há como ler o arquivo, e
 * também não há como recuperá-la: por isso o app pede para guardar um backup.
 */
(function (g) {
  'use strict';
  const P = (g.Patrimonio = g.Patrimonio || {});
  const V = (P.vault = {});

  const ITERATIONS = 600000;
  const MAGIC = 'patrimonio-cifrado';

  const subtle = () => {
    const c = g.crypto;
    if (!c || !c.subtle) throw new Error('Este navegador não oferece criptografia. Use o app do Windows ou um navegador atualizado.');
    return c.subtle;
  };
  V.available = function () {
    try {
      return !!subtle();
    } catch (e) {
      return false;
    }
  };

  function toB64(bytes) {
    let s = '';
    const b = new Uint8Array(bytes);
    for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
    return g.btoa(s);
  }
  function fromB64(s) {
    const bin = g.atob(s);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  const random = (n) => g.crypto.getRandomValues(new Uint8Array(n));
  const normUser = (u) => String(u || '').trim().toLowerCase();

  /** O objeto lido do armazenamento está criptografado? */
  V.isEnvelope = (raw) => !!(raw && typeof raw === 'object' && raw.format === MAGIC && raw.data && raw.iv && raw.salt);

  async function deriveKey(user, password, salt, iterations) {
    const material = await subtle().importKey('raw', new TextEncoder().encode(normUser(user) + '\n' + password), 'PBKDF2', false, ['deriveKey']);
    return subtle().deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations }, material, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }

  /** Nova sessão (ao criar ou trocar a senha): chave e sal novos. */
  V.createSession = async function (user, password) {
    if (!normUser(user)) throw new Error('Informe um usuário.');
    if (String(password || '').length < 6) throw new Error('A senha precisa ter pelo menos 6 caracteres.');
    const salt = random(16);
    return { key: await deriveKey(user, password, salt, ITERATIONS), salt, iterations: ITERATIONS };
  };

  /** Abre um envelope com usuário e senha. Devolve { data, session } ou lança "Usuário ou senha incorretos". */
  V.open = async function (envelope, user, password) {
    const salt = fromB64(envelope.salt);
    const iterations = Number(envelope.iterations) || ITERATIONS;
    const key = await deriveKey(user, password, salt, iterations);
    const session = { key, salt, iterations };
    return { data: await V.decrypt(session, envelope), session };
  };

  V.decrypt = async function (session, envelope) {
    let plain;
    try {
      plain = await subtle().decrypt({ name: 'AES-GCM', iv: fromB64(envelope.iv) }, session.key, fromB64(envelope.data));
    } catch (e) {
      throw new Error('Usuário ou senha incorretos.');
    }
    return JSON.parse(new TextDecoder().decode(plain));
  };

  V.encrypt = async function (session, data) {
    const iv = random(12);
    const cipher = await subtle().encrypt({ name: 'AES-GCM', iv }, session.key, new TextEncoder().encode(JSON.stringify(data)));
    return {
      format: MAGIC,
      version: 1,
      kdf: 'PBKDF2-SHA256',
      iterations: session.iterations,
      salt: toB64(session.salt),
      iv: toB64(iv),
      data: toB64(cipher),
    };
  };

  /** Envolve um backend para ler e gravar criptografado com a sessão aberta. */
  V.wrap = function (inner, session) {
    return Object.assign({}, inner, {
      encrypted: true,
      inner,
      async load() {
        const raw = await inner.load();
        return V.isEnvelope(raw) ? V.decrypt(session, raw) : raw;
      },
      async save(data) {
        return inner.save(await V.encrypt(session, data));
      },
    });
  };
})(typeof window !== 'undefined' ? window : globalThis);

          ['compras', ['magazine', 'americanas', 'shopee', 'mercadolivre', 'mercadoliv', 'mercado livre', 'amazon', 'shein', 'renner', 'riachuelo', 'marisa', 'netshoes', 'cellshop']],

          ['alimentacao', ['restaurante', 'ifood', 'lanche', 'burger', 'pizza', 'bar ', 'cafe']],
          ['saude', ['farmacia', 'drogaria', 'drogasil', 'pague menos', 'hospital', 'clinica', 'laborat', 'unilab', 'unimed', 'hapvida', 'smartfit', 'academia', 'odonto', 'medic']],
          ['educacao', ['escola', 'colegio', 'coleg', 'faculdade', 'curso', 'livraria', 'udemy']],
          ['assinaturas', ['netflix', 'spotify', 'amazon prime', 'disney', 'youtube', 'apple.com', 'google', 'hbo', 'globoplay']],
          ['viagem', ['hotel', 'hot ', 'pousada', 'airbnb', 'latam', 'gol ', 'azul ', 'booking', 'decolar', 'smiles', 'localiza', 'movida', 'rent ', 'turism']],
          ['pets', ['pet', 'veterin', 'cobasi', 'petz']],
          ['lazer', ['cinema', 'ingresso', 'show', 'teatro', 'steam', 'playstation']],
        ];
    for (const [cat, keys] of rules) if (keys.some((k) => t.includes(k.trim()) && (k.endsWith(' ') ? (' ' + t + ' ').includes(' ' + k) : true))) return cat;
    return income ? 'outrasReceitas' : 'outrosGastos';
  };

  /** Remove o prefixo "03/09 18:00 " que o BB coloca nos detalhes de Pix e cartão. */
  function cleanDetails(s) {
    return String(s || '').replace(/^\d{2}\/\d{2}(\s+\d{2}:\d{2})?\s+/, '').replace(/\s+/g, ' ').trim();
  }

  function titleCase(s) {
    return s.toLowerCase().replace(/(^|\s)(\S)/g, (m, sp, ch) => sp + ch.toUpperCase());
  }

  /**
   * Lê o extrato e devolve as linhas classificadas.
   * @returns {{rows: Array, skipped: {balance:number, investment:number, invalid:number}}}
   */
  S.parse = function (text) {
    const table = P.csv.parse(text);
    if (table.length < 2) throw new Error('O extrato está vazio.');
    const header = table[0].map(U.norm);
    const idx = {};
    Object.keys(COLS).forEach((k) => {
      const i = header.findIndex((h) => COLS[k].includes(h));
      if (i >= 0) idx[k] = i;
    });
    if (idx.date === undefined || idx.amount === undefined || idx.title === undefined) {
      throw new Error('Não reconheci as colunas do extrato. É preciso ter Data, Lançamento/Descrição e Valor.');
    }
    const cell = (r, k) => (idx[k] !== undefined && idx[k] < r.length ? r[idx[k]] : '');
    const skipped = { balance: 0, investment: 0, invalid: 0 };
    const rows = [];
    table.slice(1).forEach((r, line) => {
      const title = cell(r, 'title').trim();
      const nt = U.norm(title);
      if (SKIP_BALANCE.test(nt)) return skipped.balance++;
      const date = P.csv.parseDate(cell(r, 'date'));
      let amount = U.parseNumber(cell(r, 'amount'));
      if (!date || amount === null || amount === 0) return skipped.invalid++;
      const type = U.norm(cell(r, 'type'));
      if (type === 'saida' && amount > 0) amount = -amount;
      if (type === 'entrada' && amount < 0) amount = -amount;
      const details = cleanDetails(cell(r, 'details'));
      const investment = INVESTMENT.test(nt) || INVESTMENT.test(U.norm(details));
      const income = amount > 0;
      const note = details ? titleCase(title) + ' · ' + titleCase(details) : titleCase(title);
      const doc = cell(r, 'doc').trim();
      rows.push({
        line: line + 2,
        date,
        title,
        details,
        note,
        amount: Math.abs(amount),
        income,
        investment,
        category: S.guessCategory(title + ' ' + details, income),
        ref: 'extrato:' + date + ':' + (doc || line) + ':' + Math.abs(amount).toFixed(2) + ':' + U.norm(title),
        include: !investment,
      });
    });
    rows.forEach((r) => r.investment && skipped.investment++);
    return { rows, skipped };
  };

  /** Chave usada para lembrar a categoria escolhida para um favorecido/descrição. */
  S.ruleKey = function (r) {
    return U.norm(r.details || r.title).replace(/[0-9./-]{6,}/g, '').trim();
  };

  /** Aplica as categorias que o usuário escolheu em importações anteriores. */
  S.applyRules = function (rows, rules) {
    rules = rules || {};
    rows.forEach((r) => {
      const c = rules[S.ruleKey(r)];
      if (c && P.categoryById(c).income === r.income) {
        r.category = c;
        r.remembered = true;
      }
    });
    return rows;
  };

  /** Grava as linhas escolhidas no Orçamento, sem duplicar o que já foi importado. */
  S.importRows = function (store, rows) {
    const rules = (store.data.settings.categoryRules = store.data.settings.categoryRules || {});
    rows.forEach((r) => {
      if (!r.include || r.investment) return;
      const key = S.ruleKey(r);
      const guessed = r.suggested !== undefined ? r.suggested : S.guessCategory(r.title + ' ' + r.details, r.income);
      if (key && r.category !== guessed) rules[key] = r.category;
      else if (key && rules[key] && r.category === guessed) delete rules[key];
    });
    const existing = new Set(store.data.transactions.map((t) => t.ref).filter(Boolean));
    let added = 0, duplicates = 0;
    rows.forEach((r) => {
      if (!r.include) return;
      if (existing.has(r.ref)) return duplicates++;
      const cat = P.categoryById(r.category);
      const tx = { id: U.uid(), date: r.date, amount: r.amount, category: cat.id, income: cat.income, note: r.note, ref: r.ref };
      if (r.group) tx.group = r.group;
      store.data.transactions.push(tx);
      existing.add(r.ref);
      added++;
    });
    store.commit();
    return { added, duplicates };
  };
})(typeof window !== 'undefined' ? window : globalThis);

/* js/invoice.js */
/* Importação de fatura de cartão de crédito (PDF) para o Orçamento.
 * Testado com a fatura Ourocard do Banco do Brasil. As compras são distribuídas nas categorias
 * de despesa, e o pagamento da fatura passa a ser tratado como transferência para não contar
 * o mesmo gasto duas vezes (compras detalhadas + "Pagto cartão crédito" do extrato). */
(function (g) {
  'use strict';
  const P = (g.Patrimonio = g.Patrimonio || {});
  const U = P.util;
  const I = (P.invoice = {});

  /** Seções da fatura do BB → categoria do app (null = decidir pela descrição). */
  I.SECTIONS = [
    ['pagamentos/creditos', '__payments'],
    ['restaurantes', 'alimentacao'],
    ['supermercados', 'mercado'],
    ['saude', 'saude'],
    ['farmacias', 'saude'],
    ['vestuario', 'compras'],
    ['lojas de departamento', 'compras'],
    ['educacao', 'educacao'],
    ['lazer', 'lazer'],
    ['entretenimento', 'lazer'],
    ['viagens', 'viagem'],
    ['turismo', 'viagem'],
    ['hospedagem', 'viagem'],
    ['transporte', 'transporte'],
    ['combustivel', 'transporte'],
    ['postos', 'transporte'],
    ['telecomunicacoes', 'contas'],
    ['servicos', null],
    ['outros lancamentos', null],
    ['compras parceladas', null],
    ['compras internacionais', null],
  ];

  // ---------------------------------------------------------------------
  // Leitura do PDF (pdf.js, carregado sob demanda)
  // ---------------------------------------------------------------------

  /** Endereços do pdf.js. O Apps Script troca por CDN no build. */
  I.PDFJS_SOURCES = ['vendor/pdf.min.js', 'vendor/pdf.worker.min.js'];

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error('Não foi possível carregar o leitor de PDF (' + src + ').'));
      document.head.appendChild(s);
    });
  }

  I.loadPdfJs = async function () {
    if (!g.pdfjsLib) {
      for (const src of I.PDFJS_SOURCES) await loadScript(src);
    }
    // Com pdf.worker carregado como script comum, o pdf.js roda sem Web Worker
    // (necessário para funcionar ao abrir o arquivo direto do disco e no Apps Script).
    return g.pdfjsLib;
  };

  /** Extrai o texto do PDF, uma linha por linha visual. */
  I.extractText = async function (arrayBuffer) {
    const pdfjs = await I.loadPdfJs();
    const doc = await pdfjs.getDocument({ data: new Uint8Array(arrayBuffer), isEvalSupported: false }).promise;
    const pages = [];
    for (let n = 1; n <= doc.numPages; n++) {
      const page = await doc.getPage(n);
      const content = await page.getTextContent();
      const lines = [];
      content.items.forEach((it) => {
        if (!it.str || !it.str.trim()) return;
        const y = it.transform[5];
        let line = lines.find((l) => Math.abs(l.y - y) <= 2);
        if (!line) lines.push((line = { y, items: [] }));
        line.items.push({ x: it.transform[4], s: it.str });
      });
      lines.sort((a, b) => b.y - a.y);
      pages.push(lines.map((l) => l.items.sort((a, b) => a.x - b.x).map((i) => i.s).join(' ')).join('\n'));
    }
    return pages.join('\n');
  };

  // ---------------------------------------------------------------------
  // Interpretação do texto
  // ---------------------------------------------------------------------

  const money = (s) => U.parseNumber(String(s).replace(/\s/g, ''));
  const brDate = (s) => {
    const m = String(s || '').match(/(\d{2})\/(\d{2})\/(\d{4})/);
    return m ? m[3] + '-' + m[2] + '-' + m[1] : null;
  };

  /** Uma compra "dd/mm" recebe o ano pela data de fechamento da fatura. */
  /**
   * A fatura traz só "dd/mm". O ano vem da data de fechamento; numa parcela n,
   * a compra foi feita cerca de n−1 meses antes (ex.: 17/21 em set/2026 → compra em 2025).
   */
  function inferYear(ddmm, closingISO, installmentNumber) {
    const [d, m] = ddmm.split('/').map(Number);
    const cy = Number(closingISO.slice(0, 4));
    const cm = Number(closingISO.slice(5, 7));
    const back = installmentNumber && installmentNumber > 1 ? installmentNumber - 1 : 0;
    let y = m > cm ? cy - 1 : cy;
    if (back) {
      // Escolhe o ano que deixa a compra mais perto de "fechamento − (n−1) meses".
      const target = cy * 12 + (cm - 1) - back;
      let best = y;
      for (let cand = cy - 4; cand <= cy; cand++) {
        if (Math.abs(cand * 12 + (m - 1) - target) < Math.abs(best * 12 + (m - 1) - target)) best = cand;
      }
      y = best;
    }
    const mk = y + '-' + String(m).padStart(2, '0');
    return mk + '-' + String(Math.min(d, U.daysInMonth(mk))).padStart(2, '0');
  }

  /** Identifica a mesma compra parcelada em faturas diferentes. */
  I.installmentGroup = function (card, purchaseDate, desc, total) {
    return ['parc', card || '', purchaseDate, U.norm(desc), total].join(':');
  };

  function sectionIn(gapText) {
    const t = U.norm(gapText);
    let best = null;
    let bestPos = -1;
    I.SECTIONS.forEach(([name, cat]) => {
      const pos = t.lastIndexOf(name);
      if (pos > bestPos) {
        bestPos = pos;
        best = { name, cat };
      }
    });
    return best;
  }

  function titleCase(s) {
    return s.toLowerCase().replace(/(^|[\s*])(\S)/g, (m, sp, ch) => sp + ch.toUpperCase());
  }

  /**
   * Interpreta o texto da fatura.
   * @returns {{info: object, rows: Array}}
   */
  I.parseText = function (text) {
    // "PARC 17/21" vira "PARC17de21" para não ser confundido com uma data de compra.
    const flat = String(text || '')
      .replace(/\s+/g, ' ')
      .replace(/PARC\s?(\d{1,2})\/(\d{1,2})/gi, 'PARC$1de$2');
    const nflat = U.norm(flat);
    const info = {
      issuer: /ourocard|banco do brasil|bb\.com\.br/.test(nflat) ? 'Ourocard (BB)' : 'Cartão',
      card: (flat.match(/Final (\d{4})/) || flat.match(/Cart[aã]o (\d{4})/) || [])[1] || '',
      closing: brDate((flat.match(/Fatura fechada em (\d{2}\/\d{2}\/\d{4})/i) || [])[1]),
      due: brDate((flat.match(/Vencimento.{0,120}?(\d{2}\/\d{2}\/\d{4})/i) || [])[1]),
      total: money((flat.match(/Total da Fatura R\$ ?(-?[\d.]+,\d{2})/i) || [])[1] || ''),
      previous: money((flat.match(/Saldo fatura anterior R\$ ?(-?[\d.]+,\d{2})/i) || [])[1] || ''),
    };
    if (!info.closing) {
      const any = flat.match(/(\d{2}\/\d{2}\/\d{4})/);
      info.closing = any ? brDate(any[1]) : U.today();
    }

    const startIdx = flat.search(/Lan[cç]amentos nesta fatura/i);
    const body = startIdx >= 0 ? flat.slice(startIdx) : flat;
    const endIdx = body.search(/Total da Fatura/i);
    const scope = endIdx > 0 ? body.slice(0, endIdx) : body;

    // dd/mm  descrição (sem outra data)  país  R$ valor
    const re = /(?:^|\s)(\d{2}\/\d{2})\s((?:(?!\s\d{2}\/\d{2}\s)(?!R\$).){2,90}?)\s([A-Z]{2})\sR\$\s?(-?\d{1,3}(?:\.\d{3})*,\d{2})/g;
    const rows = [];
    let section = null;
    let last = 0;
    let m;
    const seen = {};
    while ((m = re.exec(scope))) {
      const gap = scope.slice(last, m.index);
      const s = sectionIn(gap);
      if (s) section = s;
      last = re.lastIndex;

      const rawDesc = m[2].replace(/\s+/g, ' ').trim();
      const amountSigned = money(m[4]);
      if (amountSigned === null || amountSigned === 0) continue;
      const parc = rawDesc.match(/PARC(\d{1,2})de(\d{1,2})/i);
      const desc = rawDesc.replace(/\s*(TIT-)?PARC\d{1,2}de\d{1,2}/i, '').replace(/\s*\|\s*/g, ' ').trim();
      const installment = parc ? { n: Number(parc[1]), total: Number(parc[2]) } : null;
      const purchaseDate = inferYear(m[1], info.closing, installment ? installment.n : 0);
      // Parcelas a partir da 2ª pertencem ao mês desta fatura, não ao mês da compra.
      const date = installment && installment.n > 1 ? info.closing : purchaseDate;
      const isPaymentSection = section && section.cat === '__payments';
      let kind = 'purchase';
      if (amountSigned < 0) kind = isPaymentSection && /PGTO|PAGAMENTO|PAGTO/i.test(desc) ? 'payment' : 'credit';
      else if (isPaymentSection) kind = 'credit';

      const category =
        kind === 'purchase'
          ? (section && section.cat && section.cat !== '__payments' ? section.cat : P.statement.guessCategory(desc, false))
          : 'outrasReceitas';
      const baseRef = ['fatura', info.card, info.closing, purchaseDate, U.norm(desc), installment ? installment.n + '-' + installment.total : '', Math.abs(amountSigned).toFixed(2)].join(':');
      seen[baseRef] = (seen[baseRef] || 0) + 1;
      rows.push({
        date,
        purchaseDate,
        title: desc,
        details: '',
        section: section ? section.name : '',
        note: titleCase(desc) + (installment ? ' · parcela ' + installment.n + '/' + installment.total : ''),
        amount: Math.abs(amountSigned),
        income: kind !== 'purchase',
        kind,
        installment,
        // Só compras com mais de uma parcela formam um grupo.
        group: installment && installment.total > 1 && kind === 'purchase' ? I.installmentGroup(info.card, purchaseDate, desc, installment.total) : null,
        category,
        suggested: category,
        investment: false,
        include: kind === 'purchase' || kind === 'credit',
        ref: baseRef + ':' + seen[baseRef],
        tags: [],
      });
    }

    // Estorno/crédito com o mesmo valor de uma cobrança: os dois se anulam.
    rows.filter((r) => r.kind === 'credit').forEach((credit) => {
      const match = rows.find((r) => r.kind === 'purchase' && !r.pairedWith && Math.abs(r.amount - credit.amount) < 0.005);
      if (match) {
        match.pairedWith = credit.ref;
        credit.pairedWith = match.ref;
        match.include = false;
        credit.include = false;
        match.tags.push('estornado');
        credit.tags.push('estorno');
      }
    });
    rows.forEach((r) => {
      if (r.kind === 'payment') r.tags.push('pagamento da fatura');
      if (r.kind === 'credit' && !r.pairedWith) r.note = 'Crédito na fatura · ' + r.note;
    });

    info.purchasesTotal = rows.filter((r) => r.kind === 'purchase').reduce((a, r) => a + r.amount, 0);
    info.creditsTotal = rows.filter((r) => r.kind === 'credit').reduce((a, r) => a + r.amount, 0);
    info.paymentsTotal = rows.filter((r) => r.kind === 'payment').reduce((a, r) => a + r.amount, 0);
    return { info, rows };
  };

  /**
   * Pagamentos de fatura já lançados (vindos do extrato da conta) que representariam
   * os mesmos gastos em dobro. Os que batem com o total desta fatura, com o saldo
   * anterior ou com um pagamento listado nela vêm marcados para remoção.
   */
  I.findCardPayments = function (store, parsed) {
    const targets = [parsed.info.total, parsed.info.previous]
      .concat(parsed.rows.filter((r) => r.kind === 'payment').map((r) => r.amount))
      .filter((v) => v > 0);
    return store.data.transactions
      .filter((t) => t.category === 'cartao' && !(t.ref || '').startsWith('fatura:'))
      .map((t) => ({ tx: t, suggested: targets.some((v) => Math.abs(v - t.amount) < 0.01) }))
      .sort((a, b) => (a.tx.date < b.tx.date ? 1 : -1));
  };

  /** Grava as compras escolhidas e remove os pagamentos de fatura marcados. */
  I.importRows = function (store, rows, removePaymentIds) {
    const remove = new Set(removePaymentIds || []);
    if (remove.size) store.data.transactions = store.data.transactions.filter((t) => !remove.has(t.id));
    store.data.settings.cardItemized = true;
    const res = P.statement.importRows(store, rows.map((r) => Object.assign({}, r, { investment: false })));
    // Categoria escolhida vale para todas as parcelas da mesma compra (já lançadas e futuras).
    let updated = 0;
    rows.forEach((r) => {
      if (r.include && r.group) updated += store.applyCategoryToGroup(r.group, r.category, false);
    });
    store.commit();
    return Object.assign(res, { removed: remove.size, installmentsUpdated: updated });
  };

  /** Aplica as categorias já escolhidas para outras parcelas da mesma compra. */
  I.applyInstallmentRules = function (store, rows) {
    const rules = store.data.settings.installmentRules || {};
    rows.forEach((r) => {
      if (!r.group || !rules[r.group] || !P.categoryExists(rules[r.group])) return;
      r.category = rules[r.group];
      r.tags = (r.tags || []).concat('parcela lembrada');
    });
    return rows;
  };
})(typeof window !== 'undefined' ? window : globalThis);

/* js/backends.js */
/* Onde os dados ficam: Planilha Google (Apps Script), arquivo no Windows (Electron) ou navegador. */
(function (g) {
  'use strict';
  const P = (g.Patrimonio = g.Patrimonio || {});

  const SGS_URL = (code) => {
    const f = (d) => String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
    const end = new Date();
    const start = new Date(end.getFullYear() - 10, end.getMonth(), 1);
    return 'https://api.bcb.gov.br/dados/serie/bcdata.sgs.' + code + '/dados?formato=json&dataInicial=' + f(start) + '&dataFinal=' + f(end);
  };
  P.SGS_URL = SGS_URL;

  function downloadBlob(name, content, mime) {
    const blob = new Blob(['﻿' + content], { type: mime || 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(url);
      a.remove();
    }, 500);
    return Promise.resolve({ message: 'Arquivo "' + name + '" baixado.' });
  }

  // ---- Google Apps Script (dados numa Planilha Google) ----
  function appsScriptBackend() {
    const run = (fn, ...args) =>
      new Promise((resolve, reject) => {
        g.google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
      });
    return {
      id: 'appsscript',
      label: 'Planilha Google',
      async load() {
        const json = await run('getData');
        return json ? JSON.parse(json) : null;
      },
      save(data) {
        return run('saveData', JSON.stringify(data));
      },
      async fetchSeries(code) {
        return JSON.parse(await run('fetchSeries', code));
      },
      async saveFile(name, content) {
        const url = await run('exportToDrive', name, content);
        return { message: 'Arquivo salvo no seu Google Drive.', url };
      },
      async info() {
        return JSON.parse(await run('getInfo'));
      },
    };
  }

  // ---- Windows (Electron): arquivo JSON na pasta do usuário ----
  function desktopBackend() {
    const api = g.desktopAPI;
    return {
      id: 'desktop',
      label: 'Este computador',
      async load() {
        const json = await api.load();
        return json ? JSON.parse(json) : null;
      },
      save(data) {
        return api.save(JSON.stringify(data, null, 1));
      },
      async fetchSeries(code) {
        return JSON.parse(await api.fetchText(SGS_URL(code)));
      },
      async saveFile(name, content) {
        const path = await api.saveFile(name, '﻿' + content);
        return { message: path ? 'Arquivo salvo em ' + path : 'Exportação cancelada.' };
      },
      async info() {
        return { location: await api.dataPath() };
      },
      resetBackups: () => (api.resetBackups ? api.resetBackups() : Promise.resolve()),
    };
  }

  // ---- Navegador comum: localStorage ----
  function localBackend() {
    const KEY = 'patrimonio.data.v1';
    return {
      id: 'local',
      label: 'Este navegador',
      async load() {
        const json = g.localStorage.getItem(KEY);
        return json ? JSON.parse(json) : null;
      },
      async save(data) {
        g.localStorage.setItem(KEY, JSON.stringify(data));
      },
      async fetchSeries(code) {
        const res = await fetch(SGS_URL(code));
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      },
      saveFile: (name, content) => downloadBlob(name, content),
      async info() {
        return { location: 'Armazenamento local do navegador' };
      },
    };
  }

  P.detectBackend = function () {
    if (g.google && g.google.script && g.google.script.run) return appsScriptBackend();
    if (g.desktopAPI) return desktopBackend();
    return localBackend();
  };
  P.downloadBlob = downloadBlob;

  /** Converte a resposta do SGS em { "AAAA-MM": fração }. */
  P.parseSeries = function (items) {
    const out = {};
    (items || []).forEach((it) => {
      const m = String(it.data).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      const v = Number(String(it.valor).replace(',', '.'));
      if (m && isFinite(v)) out[m[3] + '-' + m[2]] = v / 100;
    });
    return out;
  };
})(typeof window !== 'undefined' ? window : globalThis);

name: iOS build & tests

on:
  push:
    paths:
      - "PatrimonioApp/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "PatrimonioApp/**"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: PatrimonioApp
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Pick simulator
        id: sim
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          ios=sorted([k for k in d if "iOS" in k], key=lambda k: [int(x) for x in k.split("iOS-")[1].split("-")])
          for rt in reversed(ios):
              for dev in d[rt]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit()
          ')
          echo "Using simulator $ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          if ! xcodebuild test \
            -project Patrimonio.xcodeproj \
            -scheme Patrimonio \
            -destination "id=${{ steps.sim.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO > xcodebuild.log 2>&1; then
            echo "::group::Errors"
            grep -E "error:|failed|Failing tests" xcodebuild.log | sort -u | head -100
            echo "::endgroup::"
            tail -80 xcodebuild.log
            exit 1
          fi
          grep -E "Test Case .*(passed|failed)|Executed|\*\* TEST" xcodebuild.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: PatrimonioApp/xcodebuild.log

name: Patrimônio web, Apps Script e Windows

on:
  push:
    paths:
      - "PatrimonioWeb/**"
      - ".github/workflows/patrimonio-web.yml"
  pull_request:
    paths:
      - "PatrimonioWeb/**"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PatrimonioWeb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes (núcleo e Apps Script)
        run: node --test tests/*.test.js
      - name: Arquivos gerados estão atualizados
        run: |
          node tools/build.mjs
          git diff --exit-code -- appscript dist || (echo "::error::Rode 'node tools/build.mjs' e faça commit dos arquivos gerados." && exit 1)

  windows:
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: PatrimonioWeb/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: PatrimonioWeb/windows/package-lock.json
      - run: npm ci
      - name: Gerar instalador e versão portátil
        run: npm run dist -- --config.win.signAndEditExecutable=true --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Patrimonio-Windows
          path: |
            PatrimonioWeb/windows/dist/*.exe
          if-no-files-found: error
      # Página fixa de download: github.com/<repo>/releases/tag/patrimonio-windows
      - name: Publicar em Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: patrimonio-windows
          name: Patrimônio para Windows
          body: |
            Baixe um dos arquivos abaixo:
            - **Patrimonio-Instalador-1.0.0.exe**: instala e cria atalho no Menu Iniciar.
            - **Patrimonio-Portatil-1.0.0.exe**: roda direto, sem instalar.

            O Windows pode avisar "O Windows protegeu o computador" (o app não tem assinatura digital): clique em **Mais informações › Executar assim mesmo**.

            Versão gerada a partir do commit ${{ github.sha }}.
          files: PatrimonioWeb/windows/dist/*.exe
          make_latest: true
          fail_on_unmatched_files: true

# Alternativa ao Patrimonio.xcodeproj: gere o projeto com `xcodegen generate`
name: Patrimonio
options:
  bundleIdPrefix: br.com.patrimonio
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Patrimonio:
    type: application
    platform: iOS
    sources: [Patrimonio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.patrimonio.app
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: "Patrimônio"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Usamos o Face ID para proteger seus dados financeiros."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  PatrimonioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PatrimonioTests]
    dependencies:
      - target: Patrimonio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Patrimonio:
    build:
      targets:
        Patrimonio: all
        PatrimonioTests: [test]
    test:
      targets: [PatrimonioTests]
